[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "freca-audit"
version = "0.1.0"
description = "Provenance-safe FRECA Task 2 audit pipeline"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "numpy>=1.26,<2.4",
  "openpyxl>=3.1",
  "pydantic>=2.8",
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "pyyaml>=6.0",
  "rank-bm25>=0.2.2",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]
mineru = ["mineru-open-sdk>=0.2.5,<0.3"]
semantic = ["sentence-transformers>=3.0"]

[project.scripts]
freca = "freca.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
