paths:
  cases_root: extracted/SFRE_cases
  policy_pdf: 1-Export Control (Plants and Plant Products)Rules 2021.pdf
  checkpoints_xlsx: checkingpoints_all_elements_onesheet.xlsx
  submission_template: submission_template.xlsx
  build_dir: build

mineru:
  mode: disabled
  base_url: https://mineru.net/api/v4
  token_env: MINERU_TOKEN
  model: vlm
  language: en
  ocr: true
  formula: true
  table: true
  timeout_seconds: 600
  max_retries: 3

retrieval:
  recall_mode: hybrid
  fusion_mode: rrf
  reranker_mode: lexical
  selector_mode: source_aware_mmr
  bm25_weight: 0.5
  vector_weight: 0.5
  fusion_weight: 0.45
  reranker_weight: 0.55
  rrf_k: 60
  candidate_limit: 40
  mmr_lambda: 0.65
  same_source_penalty: 0.5
  same_track_penalty: 0.15
  same_location_penalty: 0.1
  min_unique_sources: 2
  agent_mode: heuristic
  max_repairs: 2
  planner_max_rounds: 1
  critic_min_confidence: 0.6

arbitration:
  tier: blind
  confidence_threshold: 0.65
  tiebreaker_required_on_disagreement: true

models:
  audit:
    base_url: https://api.example.invalid/v1
    model: configure-audit-model
    api_key_env: FRECA_AUDIT_API_KEY
    timeout_seconds: 120
    max_retries: 3
    response_format: json_schema
  verifier:
    base_url: https://api.example.invalid/v1
    model: configure-verifier-model
    api_key_env: FRECA_VERIFIER_API_KEY
    timeout_seconds: 120
    max_retries: 3
    response_format: json_schema
  arbitrator:
    base_url: https://api.example.invalid/v1
    model: configure-arbitrator-model
    api_key_env: FRECA_ARBITRATOR_API_KEY
    timeout_seconds: 120
    max_retries: 3
    response_format: json_schema
  query_rewriter:
    base_url: https://api.example.invalid/v1
    model: configure-query-rewriter-model
    api_key_env: FRECA_QUERY_REWRITER_API_KEY
    timeout_seconds: 120
    max_retries: 3
    response_format: json_schema
  embedding:
    base_url: https://api.example.invalid/v1
    model: configure-embedding-model
    api_key_env: FRECA_EMBEDDING_API_KEY
    timeout_seconds: 120
    max_retries: 3
    response_format: json_schema
  vision:
    base_url: https://api.example.invalid/v1
    model: configure-vision-model
    api_key_env: FRECA_VISION_API_KEY
    timeout_seconds: 120
    max_retries: 3
    response_format: json_schema
  reranker:
    base_url: https://api.example.invalid/v1
    model: configure-reranker-model
    api_key_env: FRECA_RERANKER_API_KEY
    timeout_seconds: 120
    max_retries: 3
    response_format: none
  retrieval_agent:
    base_url: https://api.example.invalid/v1
    model: configure-retrieval-agent-model
    api_key_env: FRECA_RETRIEVAL_AGENT_API_KEY
    timeout_seconds: 120
    max_retries: 3
    response_format: json_schema
  # Agent 升级套件 (Tier-1 planner / Tier-3 critic / 三级仲裁)
  planner: null
  critic: null
  tiebreaker: null
